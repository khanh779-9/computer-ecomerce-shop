<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="mouseRgbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="mouseGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#mouseGlow)">
    <!-- Mouse Ergonomic Silhouette -->
    <path d="M100 36 C72 36 62 70 62 110 C62 144 76 166 100 166 C124 166 138 144 138 110 C138 70 128 36 100 36 Z" fill="url(#mouseBodyGrad)" stroke="#52525b" stroke-width="2" />

    <!-- Left & Right Click Split -->
    <path d="M100 36 L100 96" stroke="#27272a" stroke-width="2.5" />

    <!-- Scroll Wheel Housing -->
    <rect x="94" y="52" width="12" height="24" rx="6" fill="#09090b" stroke="#52525b" stroke-width="1" />
    <!-- Scroll Wheel with RGB Ring -->
    <rect x="97" y="56" width="6" height="16" rx="3" fill="#27272a" />
    <rect x="98" y="60" width="4" height="8" rx="2" fill="url(#mouseRgbGrad)" />

    <!-- DPI Button -->
    <rect x="97" y="82" width="6" height="6" rx="1.5" fill="#52525b" />

    <!-- Side Grip Textures (Left) -->
    <path d="M64 96 C63 108 63 120 66 132" stroke="#3f3f46" stroke-width="3" stroke-linecap="round" />
    <path d="M67 102 C66 112 66 122 69 130" stroke="#27272a" stroke-width="2" stroke-linecap="round" />

    <!-- RGB Logo / Back Ambient Stripe -->
    <path d="M84 142 C92 148 108 148 116 142" stroke="url(#mouseRgbGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="100" cy="125" r="5" fill="none" stroke="url(#mouseRgbGrad)" stroke-width="2" />
  </g>
</svg>
