<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="budAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="earbudsGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#earbudsGlow)">
    <!-- Wireless Charging Case Base -->
    <rect x="50" y="80" width="100" height="66" rx="22" fill="url(#caseGrad)" stroke="#52525b" stroke-width="2" />
    
    <!-- Case Seam Line -->
    <line x1="50" y1="104" x2="150" y2="104" stroke="#27272a" stroke-width="2" />

    <!-- Status LED -->
    <circle cx="100" cy="116" r="2.5" fill="#22c55e" />

    <!-- Left Earbud Head -->
    <circle cx="76" cy="62" r="16" fill="#f4f4f5" stroke="#71717a" stroke-width="2" />
    <path d="M76 66 L76 96" stroke="#e4e4e7" stroke-width="7" stroke-linecap="round" />
    <circle cx="76" cy="62" r="6" fill="url(#budAccent)" />

    <!-- Right Earbud Head -->
    <circle cx="124" cy="62" r="16" fill="#f4f4f5" stroke="#71717a" stroke-width="2" />
    <path d="M124 66 L124 96" stroke="#e4e4e7" stroke-width="7" stroke-linecap="round" />
    <circle cx="124" cy="62" r="6" fill="url(#budAccent)" />
  </g>
</svg>
