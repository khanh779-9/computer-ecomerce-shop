<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
    <linearGradient id="earcupRgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="headphoneGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#headphoneGlow)">
    <!-- Headband Arc Cushion -->
    <path d="M52 106 C52 60 72 40 100 40 C128 40 148 60 148 106" stroke="#27272a" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Outer Metal Band -->
    <path d="M52 104 C52 54 70 34 100 34 C130 34 148 54 148 104" stroke="url(#headbandGrad)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Left Fork / Hanger -->
    <path d="M52 100 L52 118" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    <!-- Left Ear Cup Housing -->
    <rect x="36" y="104" width="28" height="52" rx="14" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <circle cx="50" cy="130" r="10" fill="none" stroke="url(#earcupRgb)" stroke-width="2.5" />
    <circle cx="50" cy="130" r="4" fill="url(#earcupRgb)" />
    <!-- Left Leather Cushion -->
    <rect x="58" y="108" width="10" height="44" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />

    <!-- Right Fork / Hanger -->
    <path d="M148 100 L148 118" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    <!-- Right Ear Cup Housing -->
    <rect x="136" y="104" width="28" height="52" rx="14" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <circle cx="150" cy="130" r="10" fill="none" stroke="url(#earcupRgb)" stroke-width="2.5" />
    <circle cx="150" cy="130" r="4" fill="url(#earcupRgb)" />
    <!-- Right Leather Cushion -->
    <rect x="132" y="108" width="10" height="44" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />

    <!-- Retractable Mic Boom -->
    <path d="M48 146 Q 60 166 84 164" stroke="#52525b" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="86" cy="164" r="3.5" fill="#10b981" />
  </g>
</svg>
