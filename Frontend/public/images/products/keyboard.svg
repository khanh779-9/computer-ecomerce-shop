<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="rgbKeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="33%" stop-color="#8b5cf6" />
      <stop offset="66%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="kbGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#kbGlow)">
    <!-- Main Keyboard Aluminum Chassis -->
    <rect x="22" y="58" width="156" height="84" rx="10" fill="url(#kbBodyGrad)" stroke="#52525b" stroke-width="2" />

    <!-- Top Accent RGB Bezel -->
    <line x1="30" y1="62" x2="170" y2="62" stroke="url(#rgbKeyGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Inner Keycap Plate Area -->
    <rect x="28" y="66" width="144" height="68" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1.5" />

    <!-- Row 1 (Function / Number Row) -->
    <g fill="#27272a" stroke="#3f3f46" stroke-width="0.75">
      <rect x="34" y="70" width="9" height="10" rx="2" fill="#ef4444" />
      <rect x="46" y="70" width="8" height="10" rx="2" />
      <rect x="56" y="70" width="8" height="10" rx="2" />
      <rect x="66" y="70" width="8" height="10" rx="2" />
      <rect x="76" y="70" width="8" height="10" rx="2" />
      <rect x="86" y="70" width="8" height="10" rx="2" />
      <rect x="96" y="70" width="8" height="10" rx="2" />
      <rect x="106" y="70" width="8" height="10" rx="2" />
      <rect x="116" y="70" width="8" height="10" rx="2" />
      <rect x="126" y="70" width="8" height="10" rx="2" />
      <rect x="136" y="70" width="8" height="10" rx="2" />
      <rect x="146" y="70" width="8" height="10" rx="2" />
      <rect x="156" y="70" width="10" height="10" rx="2" fill="#52525b" />
    </g>

    <!-- Row 2 (QWERTY) -->
    <g fill="#27272a" stroke="#3f3f46" stroke-width="0.75">
      <rect x="34" y="83" width="12" height="10" rx="2" fill="#3f3f46" />
      <rect x="48" y="83" width="8" height="10" rx="2" />
      <rect x="58" y="83" width="8" height="10" rx="2" />
      <rect x="68" y="83" width="8" height="10" rx="2" />
      <rect x="78" y="83" width="8" height="10" rx="2" />
      <rect x="88" y="83" width="8" height="10" rx="2" fill="#06b6d4" />
      <rect x="98" y="83" width="8" height="10" rx="2" />
      <rect x="108" y="83" width="8" height="10" rx="2" />
      <rect x="118" y="83" width="8" height="10" rx="2" />
      <rect x="128" y="83" width="8" height="10" rx="2" />
      <rect x="138" y="83" width="8" height="10" rx="2" />
      <rect x="148" y="83" width="18" height="10" rx="2" fill="#3f3f46" />
    </g>

    <!-- Row 3 (ASDF / WASD highlighted) -->
    <g fill="#27272a" stroke="#3f3f46" stroke-width="0.75">
      <rect x="34" y="96" width="15" height="10" rx="2" fill="#3f3f46" />
      <rect x="51" y="96" width="8" height="10" rx="2" fill="#06b6d4" />
      <rect x="61" y="96" width="8" height="10" rx="2" fill="#06b6d4" />
      <rect x="71" y="96" width="8" height="10" rx="2" fill="#06b6d4" />
      <rect x="81" y="96" width="8" height="10" rx="2" />
      <rect x="91" y="96" width="8" height="10" rx="2" />
      <rect x="101" y="96" width="8" height="10" rx="2" />
      <rect x="111" y="96" width="8" height="10" rx="2" />
      <rect x="121" y="96" width="8" height="10" rx="2" />
      <rect x="131" y="96" width="8" height="10" rx="2" />
      <rect x="141" y="96" width="25" height="10" rx="2" fill="#f59e0b" />
    </g>

    <!-- Row 4 (Spacebar & Modifiers) -->
    <g fill="#27272a" stroke="#3f3f46" stroke-width="0.75">
      <rect x="34" y="109" width="14" height="10" rx="2" fill="#3f3f46" />
      <rect x="50" y="109" width="11" height="10" rx="2" />
      <rect x="63" y="109" width="11" height="10" rx="2" />
      <!-- Spacebar with RGB glow -->
      <rect x="76" y="109" width="48" height="10" rx="3" fill="#3f3f46" stroke="url(#rgbKeyGrad)" stroke-width="1.5" />
      <rect x="126" y="109" width="11" height="10" rx="2" />
      <rect x="139" y="109" width="11" height="10" rx="2" />
      <rect x="152" y="109" width="14" height="10" rx="2" fill="#3f3f46" />
    </g>
  </g>
</svg>
