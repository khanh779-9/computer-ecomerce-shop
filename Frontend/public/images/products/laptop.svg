<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="laptopBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="laptopBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <filter id="laptopGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Laptop Display Bezel -->
  <g filter="url(#laptopGlow)">
    <rect x="42" y="38" width="116" height="76" rx="7" fill="url(#laptopBodyGrad)" stroke="#52525b" stroke-width="1.5" />
    
    <!-- Screen Glass & Wallpaper -->
    <rect x="48" y="44" width="104" height="64" rx="4" fill="url(#laptopScreenGrad)" />
    
    <!-- Camera Dot & Indicator -->
    <circle cx="100" cy="41" r="1.5" fill="#71717a" />
    <circle cx="104" cy="41" r="0.75" fill="#22c55e" />

    <!-- Screen Highlight / Gloss Reflex -->
    <path d="M48 44 L110 44 L70 108 L48 108 Z" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- Laptop Base / Keyboard Deck -->
  <path d="M30 114 L170 114 L180 142 A4 4 0 0 1 176 146 L24 146 A4 4 0 0 1 20 142 Z" fill="url(#laptopBaseGrad)" stroke="#71717a" stroke-width="1" />

  <!-- Trackpad Notch -->
  <rect x="86" y="115" width="28" height="2" rx="1" fill="#a1a1aa" opacity="0.8" />

  <!-- Keyboard Glow & Keys -->
  <rect x="42" y="119" width="116" height="15" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="0.5" />
  <line x1="50" y1="124" x2="150" y2="124" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />
  <line x1="46" y1="129" x2="154" y2="129" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />

  <!-- Trackpad -->
  <rect x="88" y="136" width="24" height="8" rx="2" fill="#3f3f46" stroke="#52525b" stroke-width="0.5" />
</svg>
