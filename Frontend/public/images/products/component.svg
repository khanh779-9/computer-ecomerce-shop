<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="gpuShroudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gpuRgbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="gpuGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#gpuGlow)">
    <!-- PCIe Bracket -->
    <rect x="18" y="44" width="8" height="112" rx="2" fill="#a1a1aa" stroke="#71717a" stroke-width="1" />
    <rect x="14" y="52" width="4" height="12" rx="1" fill="#71717a" />
    <rect x="14" y="74" width="4" height="12" rx="1" fill="#71717a" />

    <!-- Main GPU Shroud -->
    <rect x="24" y="52" width="156" height="92" rx="7" fill="url(#gpuShroudGrad)" stroke="#52525b" stroke-width="2" />

    <!-- Heatsink Fin Texture -->
    <line x1="30" y1="56" x2="174" y2="56" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="2 3" />
    <line x1="30" y1="139" x2="174" y2="139" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="2 3" />

    <!-- Fan 1 (Left) -->
    <circle cx="70" cy="98" r="26" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="70" cy="98" r="22" fill="none" stroke="url(#gpuRgbGrad)" stroke-width="2.5" />
    <circle cx="70" cy="98" r="8" fill="#3f3f46" />
    <path d="M70 76 L70 90 M70 106 L70 120 M48 98 L62 98 M78 98 L92 98" stroke="#52525b" stroke-width="2" stroke-linecap="round" />

    <!-- Fan 2 (Right) -->
    <circle cx="132" cy="98" r="26" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="132" cy="98" r="22" fill="none" stroke="url(#gpuRgbGrad)" stroke-width="2.5" />
    <circle cx="132" cy="98" r="8" fill="#3f3f46" />
    <path d="M132 76 L132 90 M132 106 L132 120 M110 98 L124 98 M140 98 L154 98" stroke="#52525b" stroke-width="2" stroke-linecap="round" />

    <!-- Gold PCIe Connector Pins -->
    <rect x="52" y="144" width="94" height="8" rx="1" fill="#eab308" stroke="#ca8a04" stroke-width="0.5" />
    <line x1="90" y1="144" x2="90" y2="152" stroke="#18181b" stroke-width="3" />

    <!-- Top Logo / GeForce Bar -->
    <rect x="42" y="58" width="50" height="6" rx="2" fill="url(#gpuRgbGrad)" opacity="0.9" />
  </g>
</svg>
