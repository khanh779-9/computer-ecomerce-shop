<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="subwooferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="speakerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#speakerGlow)">
    <!-- Speaker Cabinet -->
    <rect x="52" y="32" width="96" height="136" rx="16" fill="url(#speakerBodyGrad)" stroke="#52525b" stroke-width="2" />

    <!-- Tweeter (Top Small Driver) -->
    <circle cx="100" cy="70" r="22" fill="#09090b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="100" cy="70" r="16" fill="none" stroke="url(#subwooferGrad)" stroke-width="2" />
    <circle cx="100" cy="70" r="8" fill="#52525b" />

    <!-- Woofer (Bottom Large Driver) -->
    <circle cx="100" cy="126" r="32" fill="#09090b" stroke="#3f3f46" stroke-width="2.5" />
    <circle cx="100" cy="126" r="26" fill="none" stroke="url(#subwooferGrad)" stroke-width="3" />
    <circle cx="100" cy="126" r="14" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
    <circle cx="100" cy="126" r="6" fill="url(#subwooferGrad)" />

    <!-- Volume & Power Indicator Dial -->
    <circle cx="100" cy="44" r="3" fill="#22c55e" />
  </g>
</svg>
