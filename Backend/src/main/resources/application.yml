spring:
  config:
    # Đọc biến cấu hình từ file .env (hỗ trợ cả khi chạy từ thư mục Backend/ hoặc root repo)
    import: optional:file:.env[.properties],optional:file:Backend/.env[.properties]
  datasource:
    # DB_URL hoặc DATABASE_URL (Render) — post-processor tự thêm tiền tố jdbc: nếu thiếu
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/techzone_computer}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:123}}
  jpa:
    hibernate: { ddl-auto: update }
    open-in-view: false
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
server.port: ${SERVER_PORT:8080}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:2QXUI4B4}
  hash-secret: ${VNPAY_HASH_SECRET:RAOCTXGU2XFZ8TGUSWUXZNYAEBGQOZAW}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
